name: Generate trophy card

on:
  schedule:
    - cron: "* */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate trophy.svg
        uses: ryo-ma/github-profile-trophy@master
        with:
          github_user_name: ${{ github.repository_owner }}
          output_path: dist/trophy.svg
          theme: dracula
          max_rows: 1
          margin_width: 8
          margin_height: 8
          no_background: false
          no_frame: false

      - name: push trophy.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
